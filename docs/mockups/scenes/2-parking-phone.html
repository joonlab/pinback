<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1800,h=1331,scale=1">
<title>장면 2 · 펼친 화면 — 목록 | 주차 상세</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="../_app.css">
<style>
  /* 폴드8 펼친 화면 가로 1.35:1 — 540 x 399dp 를 3.33배 */
  body { margin:0; background:#000; }
  .screen { zoom: 3.333; width: 540px; height: 399px; border-radius: 0; }
  .status-bar { height: 24px; font-size: 12px; padding: 0 16px; }
  .app-bar { height: 44px; gap: 8px; padding: 0 14px; }
  .app-bar .title { font-size: 18px; }
  .two-pane.list-detail { grid-template-columns: 225px 1fr; }
  .two-pane > .pane { padding: 10px 12px; gap: 7px; }
  .savebtn { height: 44px; font-size: 15px; }
  .lbl { margin: 4px 2px 0; font-size: 12px; }
  .prow { padding: 9px 10px; gap: 10px; }
  .prow .tile { width: 34px; height: 34px; font-size: 18px; }
  .prow .nm { font-size: 15px; } .prow .mt { font-size: 12.5px; }
  .dh { font-size: 21px; line-height: 27px; }
  .dsub { font-size: 13.5px; }
  .navbtn { height: 42px; font-size: 16px; }
  .photo { height: 108px; }
  .photo .pillar { font-size: 38px; color: var(--text); opacity: .75; }
  .info .r { font-size: 14px; }
</style></head><body>
<div class="screen app-pinback light">
  <div class="status-bar" data-time="6:05"></div>
  <div class="app-bar"><img class="mark" data-app="pinback" alt=""><span class="title">핀백</span><span class="spacer"></span><span class="icon-btn"><i data-icon="settings"></i></span><span class="theme-btn"><i data-icon="sun"></i><span>자동</span></span></div>
  <div class="two-pane list-detail">
    <div class="pane">
      <div class="savebtn"><i data-pi="map-pin-plus"></i>지금 위치 저장</div>
      <div class="lbl">저장한 장소 3곳</div>
      <div class="prow park sel"><div class="tile"><i data-pi="car"></i></div><div class="grow" style="min-width:0"><div class="nm">회사 주차장 B2</div><div class="mt">오늘 오전 8:52 · 60m</div></div></div>
      <div class="prow"><div class="tile"><i data-icon="map-pin"></i></div><div class="grow" style="min-width:0"><div class="nm">창가 자리 좋은 카페</div><div class="mt">어제 · 2.4km</div></div></div>
      <div class="prow"><div class="tile"><i data-icon="map-pin"></i></div><div class="grow" style="min-width:0"><div class="nm">처음 가 본 국숫집</div><div class="mt">3일 전 · 5.1km</div></div></div>
    </div>
    <div class="pane">
      <div class="row" style="align-items:flex-start"><div class="grow"><div class="dh">회사 주차장 B2</div><div class="dsub">9시간 전 자동 저장 · 여기서 60m</div></div><span class="pill park" style="margin-top:4px">주차</span></div>
      <div class="navbtn"><i data-pi="navigation"></i>길찾기</div>
      <div class="photo"><div class="pillar">B2 · C-14</div></div>
      <div class="info"><div class="r" style="font-size:14.5px">엘리베이터 앞에서 두 번째 칸</div><div class="r"><i data-icon="map-pin"></i><span class="k">오차</span><span class="v">약 8m</span></div></div>
    </div>
  </div>
</div>
<script src="../_icons.js"></script>
</body></html>
