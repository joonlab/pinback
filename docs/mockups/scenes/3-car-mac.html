<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1800,h=1125,scale=1">
<title>장면 3 · 맥 화면 — 주말 준비 메모</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="../_app.css">
<style>
  body { margin:0; background:#000; }
  .desk { zoom: 2.25; width: 800px; height: 500px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #D6E3F5 0%, #A9C0E0 45%, #7893BC 100%); }
  .mac-menubar { font-size: 14px; }
  .notes { position: absolute; left: 90px; top: 50px; width: 620px; height: 420px; }
  .notes .mac-split { grid-template-columns: 160px 1fr; }
  .note-item { padding: 8px 10px; border-radius: 8px; font-size: 14px; line-height: 20px; }
  .note-item.on { background: #F4D26B; }
  .note-item .dim { font-size: 12px; }
  .note { padding: 24px 26px; font-size: 20px; line-height: 34px; }
  .note h1 { font-size: 28px; line-height: 38px; margin: 0 0 10px; font-weight: 700; }
  .note .done { color: var(--mac-dim); text-decoration: line-through; }
</style></head><body>
<div class="desk light">
  <div class="mac-menubar">
    <span class="app-name">메모</span><span>파일</span><span>편집</span><span>형식</span><span>보기</span><span>윈도우</span>
    <div class="extras"><span class="extra"><i data-icon="wifi"></i></span><span class="extra"><i data-icon="battery"></i></span><span class="clock">9월 27일 (토) 오전 8:40</span></div>
  </div>
  <div class="mac-window notes">
    <div class="mac-titlebar"><span class="traffic"><i></i><i></i><i></i></span><span class="mac-title">메모</span></div>
    <div class="mac-split">
      <div class="mac-sidebar">
        <div class="note-item on"><b>새 차 받은 날</b><div class="dim">오전 8:38</div></div>
        <div class="note-item"><b>장보기 목록</b><div class="dim">어제</div></div>
        <div class="note-item"><b>읽을 책</b><div class="dim">9월 25일</div></div>
      </div>
      <div class="note">
        <h1>새 차 받은 날</h1>
        <div class="done">블루투스 페어링</div>
        <div>핀백에서 내 차 고르기</div>
        <div>하이패스 카드 등록</div>
        <div>서준이한테 사진 보내기</div>
      </div>
    </div>
  </div>
</div>
</body></html>
