<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1662,h=1800,scale=1">
<title>장면 2 · 맥 화면 오른쪽 — 퇴근 전 할 일</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="../_app.css">
<style>
  body { margin:0; background:#000; }
  .desk { zoom: 2.25; width: 739px; height: 800px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #D6E3F5 0%, #A9C0E0 45%, #7893BC 100%); }
  .mac-menubar { font-size: 14px; }
  .win { position: absolute; left: 30px; top: 60px; width: 680px; height: 700px; }
  .day { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .day h1 { font-size: 30px; line-height: 40px; margin: 0; font-weight: 700; }
  .day .d { font-size: 17px; color: var(--mac-dim); margin-top: -8px; }
  .ev { display: flex; gap: 16px; align-items: stretch; }
  .ev .t { width: 104px; font-size: 19px; color: var(--mac-dim); padding-top: 12px; font-variant-numeric: tabular-nums; }
  .ev .b { flex: 1; border-radius: 10px; padding: 12px 16px; font-size: 22px; line-height: 30px; font-weight: 600;
    background: #E6EEFB; border-left: 5px solid #3B73D9; }
  .ev .b .s { font-size: 18px; font-weight: 400; color: var(--mac-dim); }
  .ev.past .b { opacity: .5; }
  .ev.now .b { background: #FBEFD9; border-left-color: #D9922B; }
</style></head><body>
<div class="desk light">
  <div class="mac-menubar">
    
    <div class="extras"><span class="extra"><i data-icon="wifi"></i></span><span class="extra"><i data-icon="battery"></i></span><span class="clock">9월 29일 (월) 오후 6:05</span></div>
  </div>
  <div class="mac-window win">
    <div class="mac-titlebar"><span class="mac-title">캘린더</span></div>
    <div class="day">
      <h1>오늘</h1><div class="d">9월 29일 월요일</div>
      <div class="ev past"><div class="t">오후 2:00</div><div class="b">주간 회의<div class="s">3층 회의실</div></div></div>
      <div class="ev past"><div class="t">오후 4:30</div><div class="b">디자인 검토<div class="s">서준</div></div></div>
      <div class="ev now"><div class="t">오후 6:00</div><div class="b">퇴근<div class="s">차 타고 장보기</div></div></div>
      <div class="ev"><div class="t">오후 7:00</div><div class="b">장보기<div class="s">행복마트</div></div></div>
    </div>
  </div>
</div>
</body></html>
